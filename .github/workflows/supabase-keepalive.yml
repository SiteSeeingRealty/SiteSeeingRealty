# Keeps the Supabase project awake. Free-tier projects pause after ~7 days with
# no requests, so this pings daily, giving several missed runs of margin.
#
# Works with no repo secrets: it hits the live site's /api/keepalive route,
# which already holds the Supabase env vars on Vercel. If SUPABASE_URL and
# SUPABASE_ANON_KEY secrets are added, it also pings Supabase directly. The run
# passes when either ping succeeds.
name: Supabase keepalive

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://site-seeing-realty.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ok=0

          auth=()
          if [ -n "$CRON_SECRET" ]; then auth=(-H "Authorization: Bearer $CRON_SECRET"); fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors \
            "${auth[@]}" "$SITE_URL/api/keepalive" || true)
          echo "Site route: HTTP $status"
          [ "$status" = "200" ] && ok=1

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors \
              "$SUPABASE_URL/rest/v1/plots?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
            echo "Direct Supabase: HTTP $status"
            [ "$status" = "200" ] && ok=1
          else
            echo "Direct Supabase: skipped (secrets not set)"
          fi

          if [ "$ok" != "1" ]; then
            echo "::error::Supabase did not answer. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling through the API each run resets that clock, so the pinger
      # cannot switch itself off on a quiet repo.
      - name: Stay enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
